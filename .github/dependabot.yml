version: 2

updates:
  # Python (Poetry via pip ecosystem)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      python-minor:
        update-types:
          - "minor"
          - "patch"

  # Node / npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      npm-minor:
        update-types:
          - "minor"
          - "patch"

  # Production Django Dockerfile base image
  - package-ecosystem: "docker"
    directory: "/compose/production/django"
    schedule:
      interval: "weekly"
      day: "monday"

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
