# ============================================================
# FLAKE8 — Fast Style Checker
# ============================================================
[flake8]
max-line-length = 120
exclude =
    .tox,
    .git,
    */migrations/*,
    */static/CACHE/*,
    docs,
    node_modules,
    venv
ignore =
    E501,   # line too long (Black handles this)
    W503,   # line break before binary operator (outdated rule)
    F403,   # 'from module import *' used (sometimes needed in settings)
    F405,   # name may be undefined from star import (related to F403)
    E203    # whitespace before ':' (conflicts with Black's slice formatting)

# ============================================================
# PYCODESTYLE (used by flake8 internally)
# ============================================================
[pycodestyle]
max-line-length = 120
exclude =
    .tox,
    .git,
    */migrations/*,
    */static/CACHE/*,
    docs,
    node_modules,
    venv

# ============================================================
# MYPY — Static Type Checker
# ============================================================
[mypy]
python_version = 3.11
check_untyped_defs = True
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
plugins = mypy_django_plugin.main
exclude = (?x)(migrations/|docs/)

[mypy.plugins.django-stubs]
django_settings_module = config.settings.test

[mypy-*.migrations.*]
# Django migrations should not produce any errors:
ignore_errors = True