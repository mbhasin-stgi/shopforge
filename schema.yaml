  /api/products/:
    get:
      operationId: products_list
      description: |-
        API endpoint for products.

        list:     GET /api/products/                 (with filtering, search, pagination)
        create:   POST /api/products/                (admin only)
        detail:   GET /api/products/{id}/
        update:   PUT /api/products/{id}/            (admin only)
        delete:   DELETE /api/products/{id}/          (admin only)
        featured: GET /api/products/featured/         (custom action)
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: is_featured
        schema:
          type: boolean
      - in: query
        name: max_price
        schema:
          type: number
      - in: query
        name: min_price
        schema:
          type: number
      - in: query
        name: on_sale
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      tags:
      - products
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductListList'
          description: ''
