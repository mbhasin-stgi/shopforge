components:
  schemas:
    Category:
      type: object
      description: Serializer for product categories.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        parent:
          type: integer
          nullable: true
        is_active:
          type: boolean
        display_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        product_count:
          type: integer
          readOnly: true
          default: 0
        children:
          type: string
          readOnly: true
      required:
      - children
      - id
      - name
      - product_count
      - slug
    CategoryList:
      type: object
      description: Lightweight category serializer for list views and nested usage.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - id
      - name
      - slug
    Login:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - password
    OrderCreate:
      type: object
      description: |-
        Serializer for creating a new order.

        This is a plain Serializer (not ModelSerializer) because order creation
        involves complex logic: stock checking, price locking, payment initiation.
        The view/service handles the orchestration.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemCreate'
        shipping_address_line1:
          type: string
          maxLength: 200
        shipping_address_line2:
          type: string
          default: ''
          maxLength: 200
        shipping_city:
          type: string
          maxLength: 100
        shipping_state:
          type: string
          maxLength: 100
        shipping_postal_code:
          type: string
          maxLength: 20
        shipping_country:
          type: string
          default: US
          maxLength: 100
      required:
      - items
      - shipping_address_line1
      - shipping_city
      - shipping_postal_code
      - shipping_state
    OrderDetail:
      type: object
      description: Full order serializer with all line items.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        order_number:
          type: string
          readOnly: true
        customer_email:
          type: string
          format: email
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusB80Enum'
        payment_status:
          $ref: '#/components/schemas/PaymentStatusEnum'
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        tax_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        shipping_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        shipping_address_line1:
          type: string
          maxLength: 200
        shipping_address_line2:
          type: string
          maxLength: 200
        shipping_city:
          type: string
          maxLength: 100
        shipping_state:
          type: string
          maxLength: 100
        shipping_postal_code:
          type: string
          maxLength: 20
        shipping_country:
          type: string
          maxLength: 100
        tracking_number:
          type: string
          maxLength: 200
        notes:
          type: string
          description: Internal notes about this order
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when this record was first created.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when this record was last modified.
      required:
      - created_at
      - customer_email
      - id
      - items
      - order_number
      - shipping_address_line1
      - shipping_city
      - shipping_postal_code
      - shipping_state
      - subtotal
      - total
      - updated_at
    OrderItem:
      type: object
      description: Serializer for order line items.
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: string
          format: uuid
        product_name:
          type: string
          readOnly: true
          description: Product name at time of purchase
        product_sku:
          type: string
          readOnly: true
          description: SKU at time of purchase
        price_at_purchase:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: Unit price when the order was placed
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 1
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - id
      - line_total
      - price_at_purchase
      - product
      - product_name
      - product_sku
      - quantity
    OrderItemCreate:
      type: object
      description: Serializer for creating order items (input validation).
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
      required:
      - product_id
      - quantity
    OrderList:
      type: object
      description: Lightweight order serializer for list views.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        order_number:
          type: string
          readOnly: true
        status:
